
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Wred is a fast, orjson-powered ASGI router for JSON APIs.">
  <title>Wred — A fast ASGI router for JSON APIs</title>
  <style>
    :root {
      --red: #cb2034;
    }

    body {
      max-width: 720px;
      margin: 10vh auto;
      padding: 0 24px;
      font-family: monospace;
      font-size: 16px;
      line-height: 1.6;
    }

    h1 {
      max-width: 560px;
      font-size: 30px;
      line-height: 1.4;
      font-weight: normal;
      margin: 0;
    }

    h1 img {
      height: 64px;
      vertical-align: baseline;
      margin-block: -20px;
      margin-right: -12px;
    }

    a {
      color: inherit;
      text-underline-offset: 3px;
    }

    pre {
      font: inherit;
      line-height: 1.6;
      margin: 0;
      overflow-x: auto;
    }

    .example {
      margin-top: 25px;
    }

    .install {
      margin-bottom: 50px;
      color: black;
      font-weight: bold;
    }

    .keyword {
      color: var(--red);
      font-weight: bold;
    }

    .decorator {
      color: var(--red);
      font-style: italic;
    }

    .string {
      color: var(--red);
    }
  </style>
</head>
<body>
  <h1>
    <img src="https://patx.gitman.io/wred/wred-logo.png" alt="Wred">
    is a fast, orjson-powered ASGI router for JSON APIs.
    Read the docs and view the source
    <a href="https://gitman.io/patx/wred">here</a>.
  </h1>

  <div class="example">
    <pre class="install">$ pip install wred</pre>

    <pre><code><span class="keyword">from</span> wred <span class="keyword">import</span> App

app = App()

<span class="decorator">@app.route</span>(<span class="string">"/"</span>)
<span class="keyword">async def</span> index(request):
    <span class="keyword">return</span> {<span class="string">"hello"</span>: <span class="string">"world"</span>}</code></pre>
  </div>
</body>
</html>
