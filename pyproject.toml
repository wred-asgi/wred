[build-system]
requires = ["flit_core>=3.11,<5"]
build-backend = "flit_core.buildapi"

[project]
name = "wred"
dynamic = ["version"]
description = "An ultra-minimal ASGI framework for JSON APIs."
readme = "docs/README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Harrison Erd", email = "harrisonerd@gmail.com" }]
dependencies = ["orjson", "weft-server"]
